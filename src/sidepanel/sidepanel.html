<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title data-i18n="sidepanel.title">TNClubManagement Save Form</title>
    <link rel="stylesheet" href="./sidepanel.css" />
  </head>
  <body>
    <header class="app-header">
      <img class="app-logo" src="/public/icons/icon48.png" alt="" width="20" height="20" />
      <h1 data-i18n="sidepanel.title">TNClubManagement Save Form</h1>
    </header>

    <div id="current-page" class="current-page"></div>

    <main class="panel">
      <section class="card">
        <div class="card-header card-header-row">
          <div>
            <h2 data-i18n="sidepanel.savedVersions.title">Phiên bản đã lưu</h2>
            <p class="card-subtitle" data-i18n="sidepanel.savedVersions.subtitle">Lưu nhiều phiên bản có tên cho từng form, khôi phục lại bất cứ lúc nào.</p>
          </div>
          <button id="reload-forms" class="icon-btn" type="button" data-i18n-title="sidepanel.reload.title" title="Tải lại danh sách form trên trang này">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12a9 9 0 1 1-3-6.7L21 8" />
              <path d="M21 3v5h-5" />
            </svg>
          </button>
        </div>
        <div id="forms-container"></div>
      </section>

      <section class="card">
        <div class="card-header card-header-row">
          <div>
            <h2 data-i18n="sidepanel.draft.title">Bản nháp tự động</h2>
            <p class="card-subtitle" data-i18n="sidepanel.draft.subtitle">SaveForm tự lưu tạm khi bạn gõ, dùng để khôi phục nếu lỡ tải lại trang. Mặc định tắt.</p>
          </div>
          <label class="switch" data-i18n-title="sidepanel.draft.toggleTitle" title="Bật/tắt tự động lưu bản nháp">
            <input type="checkbox" id="autosave-toggle" />
            <span class="switch-track"><span class="switch-thumb"></span></span>
          </label>
        </div>
        <p id="status" class="status"></p>
        <ul id="snapshot-list" class="snapshot-list"></ul>
      </section>
    </main>

    <footer class="app-footer">
      <a id="open-options" href="#" data-i18n="sidepanel.openOptions">Quản lý domain được phép &rarr;</a>
    </footer>

    <script type="module" src="./sidepanel.ts"></script>
  </body>
</html>
